<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" fill="none" role="img" aria-label="SkillBridge Career Pathway Illustration">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FA" />
      <stop offset="100%" stop-color="#E2EEF5" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123B5D" />
      <stop offset="50%" stop-color="#0F8B8D" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123B5D" flood-opacity="0.12" />
    </filter>
    <filter id="chipShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F8B8D" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient Background Circles -->
  <circle cx="340" cy="250" r="210" fill="url(#skyGrad)" opacity="0.8" />
  <circle cx="480" cy="120" r="80" fill="#F4C95D" opacity="0.15" />
  <circle cx="160" cy="380" r="110" fill="#0F8B8D" opacity="0.08" />

  <!-- Dotted Pathway Guidance Grid -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <line x1="80" y1="420" x2="600" y2="420" />
    <line x1="80" y1="320" x2="600" y2="320" />
    <line x1="80" y1="220" x2="600" y2="220" />
    <line x1="80" y1="120" x2="600" y2="120" />
  </g>

  <!-- Central Bridge Arch Base Structure -->
  <path d="M90 410 C 220 280, 420 280, 570 410" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M120 410 L120 360 M220 410 L220 310 M340 410 L340 285 M460 410 L460 310 M540 410 L540 370" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- The Ascending Dynamic Skill Pathway -->
  <path d="M80 400 C 180 390, 240 330, 320 250 C 390 180, 480 140, 580 90" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M80 400 C 180 390, 240 330, 320 250 C 390 180, 480 140, 580 90" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Stepping Milestone Nodes Along Pathway -->
  <!-- Milestone 1: Foundation / School -->
  <g transform="translate(100, 395)" filter="url(#chipShadow)">
    <circle cx="0" cy="0" r="16" fill="#123B5D" stroke="#FFFFFF" stroke-width="4" />
    <!-- Book/Education Icon -->
    <path d="M-6 -4 L0 -1 L6 -4 L6 4 L0 7 L-6 4 Z" fill="#FFFFFF" />
  </g>

  <!-- Milestone 2: Skills & Courses -->
  <g transform="translate(240, 320)" filter="url(#chipShadow)">
    <circle cx="0" cy="0" r="18" fill="#0F8B8D" stroke="#FFFFFF" stroke-width="4" />
    <!-- Gear/Skill Icon -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M0 -9 L0 -6 M0 6 L0 9 M-9 0 L-6 0 M6 0 L9 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Milestone 3: Learnership / Internship -->
  <g transform="translate(390, 200)" filter="url(#chipShadow)">
    <circle cx="0" cy="0" r="20" fill="#14B8A6" stroke="#FFFFFF" stroke-width="4" />
    <!-- Rocket / Launch Icon -->
    <path d="M0 -8 C 4 -5, 6 2, 0 8 C -6 2, -4 -5, 0 -8 Z" fill="#FFFFFF" />
    <circle cx="0" cy="-1" r="2.5" fill="#123B5D" />
  </g>

  <!-- Milestone 4: Career Breakthrough / Goal Reached -->
  <g transform="translate(565, 95)" filter="url(#chipShadow)">
    <circle cx="0" cy="0" r="26" fill="#F4C95D" stroke="#FFFFFF" stroke-width="5" />
    <!-- Star / Trophy Icon -->
    <path d="M0 -12 L3 -4 L11 -4 L5 2 L7 10 L0 5 L-7 10 L-5 2 L-11 -4 L-3 -4 Z" fill="#123B5D" />
  </g>

  <!-- Floating UI Card 1: Verified Opportunity -->
  <g transform="translate(60, 180)" filter="url(#softGlow)">
    <rect width="210" height="96" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#E6FFFA" />
    <!-- Verified Badge Icon -->
    <path d="M31 25 L29 37 L31 39 L40 27" stroke="#0F8B8D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="31" cy="31" r="10" stroke="#0F8B8D" stroke-width="2" fill="none" />
    
    <text x="56" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#123B5D">Verified Opportunity</text>
    <text x="56" y="42" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#64748B">Cape Town • NQF Level 5</text>
    <rect x="14" y="58" width="180" height="6" rx="3" fill="#E2E8F0" />
    <rect x="14" y="58" width="145" height="6" rx="3" fill="#0F8B8D" />
    <text x="14" y="78" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#0F8B8D">No Application Fee • Safe Portal</text>
  </g>

  <!-- Floating UI Card 2: Application Prepared -->
  <g transform="translate(380, 280)" filter="url(#softGlow)">
    <rect width="220" height="106" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="32" cy="34" r="16" fill="#FEF3C7" />
    <path d="M26 34 L30 38 L38 29" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="56" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#123B5D">Application Ready</text>
    <text x="56" y="46" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#64748B">CV &amp; Certified ID Attached</text>
    
    <g transform="translate(16, 62)">
      <rect width="60" height="24" rx="6" fill="#F1F5F9" />
      <text x="30" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Matric ✓</text>
      
      <rect x="68" width="58" height="24" rx="6" fill="#F1F5F9" />
      <text x="97" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">STAR CV ✓</text>
      
      <rect x="134" width="54" height="24" rx="6" fill="#ECFDF5" />
      <text x="161" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669">Ready</text>
    </g>
  </g>

  <!-- Floating Badge: Youth Empowerment -->
  <g transform="translate(470, 45)" filter="url(#softGlow)">
    <rect width="160" height="38" rx="19" fill="#123B5D" />
    <circle cx="20" cy="19" r="10" fill="#F4C95D" />
    <text x="20" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#123B5D">★</text>
    <text x="40" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">100% Free Access</text>
  </g>

  <!-- Upward Trend Rays -->
  <g stroke="#F4C95D" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="595" y1="75" x2="615" y2="60" />
    <line x1="575" y1="55" x2="585" y2="40" />
    <line x1="550" y1="58" x2="540" y2="42" />
  </g>
</svg>
